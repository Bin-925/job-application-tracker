spring:
  session:
    jdbc:
      schema: classpath:db/session-h2.sql
  datasource:
    url: jdbc:h2:file:./data/jobtracker;MODE=PostgreSQL;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DEMO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
server:
  address: 127.0.0.1
