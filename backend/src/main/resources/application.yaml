spring:
  jackson:
    # Preserve the existing API defaults while using Boot 4's Jackson 3 mapper.
    use-jackson2-defaults: true
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000
      "[mail.debug]": false
  flyway:
    enabled: false
  config:
    import: optional:application-secret.yml
  session:
    timeout: 30m
    jdbc:
      initialize-schema: always
      schema: classpath:db/session-mysql.sql
  # 기본 프로파일 = 로컬 개발(MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/jobtracker?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
