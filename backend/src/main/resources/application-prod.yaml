spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true
  session:
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
server:
  port: ${PORT:8080}
app:
  session:
    secure: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
