spring:
  flyway:
    enabled: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: always
      schema: classpath:db/session-h2.sql
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  rate-limit:
    enabled: false
