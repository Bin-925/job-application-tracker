plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.bin'
version = '0.0.1-SNAPSHOT'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'    // 로컬 실행용 MySQL
	runtimeOnly 'org.postgresql:postgresql'       // 배포용 PostgreSQL
	runtimeOnly 'com.h2database:h2'                // 테스트 및 명시적 demo 프로파일 전용
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// Password hashing and JDBC-backed sessions
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.18.0'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.icegreen:greenmail:2.1.14'
	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
}
tasks.named('test') {
	useJUnitPlatform { excludeTags 'postgres' }
}

tasks.register('postgresTest', Test) {
	description = 'Runs Flyway and session integration tests against disposable PostgreSQL containers.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'postgres' }
	shouldRunAfter tasks.named('test')
}

// The Windows Java launcher reads argument files using the native code page.
// A manifest classpath preserves Unicode checkout paths using URI encoding.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    def testClasspathJar = tasks.register('testClasspathJar', Jar) {
        dependsOn testClasses
        destinationDirectory = file("${gradle.gradleUserHomeDir}/jobtracker-classpaths/${projectDir.absolutePath.hashCode()}")
        archiveFileName = 'test-classpath.jar'
        doFirst {
            manifest.attributes('Class-Path': sourceSets.test.runtimeClasspath.files
                    .collect { it.toURI().toASCIIString() }.join(' '))
        }
    }
	tasks.withType(Test).configureEach {
        dependsOn testClasspathJar
        inputs.files(sourceSets.test.runtimeClasspath).withPropertyName('runtimeClasspathContents')
        classpath = files(testClasspathJar.flatMap { it.archiveFile })
    }
}
