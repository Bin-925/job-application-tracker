plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.bin'
version = '0.0.1-SNAPSHOT'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'    // 로컬 실행용 MySQL
	runtimeOnly 'org.postgresql:postgresql'       // 배포용 PostgreSQL
	runtimeOnly 'com.h2database:h2'                // 테스트 및 명시적 demo 프로파일 전용
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// 비밀번호 암호화 + JWT 인증
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
tasks.named('test') {
	useJUnitPlatform()
}

// The Windows Java launcher reads argument files using the native code page.
// A manifest classpath preserves Unicode checkout paths using URI encoding.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    def testClasspathJar = tasks.register('testClasspathJar', Jar) {
        dependsOn testClasses
        destinationDirectory = file("${gradle.gradleUserHomeDir}/jobtracker-classpaths/${projectDir.absolutePath.hashCode()}")
        archiveFileName = 'test-classpath.jar'
        doFirst {
            manifest.attributes('Class-Path': sourceSets.test.runtimeClasspath.files
                    .collect { it.toURI().toASCIIString() }.join(' '))
        }
    }
    tasks.named('test') {
        dependsOn testClasspathJar
        inputs.files(sourceSets.test.runtimeClasspath).withPropertyName('runtimeClasspathContents')
        classpath = files(testClasspathJar.flatMap { it.archiveFile })
    }
}
