services:
  postgres:
    image: postgres:17-alpine
    labels:
      com.jobtracker.purpose: upgrade-check
    environment:
      POSTGRES_USER: upgrade_check
      POSTGRES_PASSWORD: ${UPGRADE_DB_PASSWORD:?Use the isolated upgrade runner}
      POSTGRES_DB: upgrade_check
    ports:
      - "127.0.0.1:15591:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=536870912
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgrade_check -d upgrade_check"]
      interval: 2s
      timeout: 3s
      retries: 30
