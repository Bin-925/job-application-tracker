name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Verify PostgreSQL migrations and sessions
        run: ./gradlew postgresTest --no-daemon

      - name: Upload PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: |
            backend/build/reports/tests/postgresTest
            backend/build/test-results/postgresTest
          retention-days: 7
