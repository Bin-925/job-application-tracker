name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-permissions:
    name: Windows backup permissions
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify private file permissions without changing ownership
        shell: pwsh
        run: ./tests/backup/Test-BackupPermissions.ps1
  automation:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify load-test safety configuration
        run: node --test ../tests/load/config.test.mjs

  frontend:
    name: Frontend and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pwa
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-test-results
          path: frontend/test-results/
          retention-days: 7

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test bootJar --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7

  postgres:
    name: PostgreSQL migrations and sessions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Verify PostgreSQL migrations and sessions
        run: ./gradlew postgresTest --no-daemon
      - name: Verify backup and isolated restore scripts
        shell: pwsh
        run: ../tests/backup/Test-Backup.ps1
      - name: Upload PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: |
            backend/build/reports/tests/postgresTest
            backend/build/test-results/postgresTest
          retention-days: 7
