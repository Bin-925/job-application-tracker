name: jobtracker-dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: jobtracker-postgres
    restart: unless-stopped
    labels:
      com.jobtracker.purpose: development
    environment:
      POSTGRES_USER: jobtracker_admin
      POSTGRES_DB: jobtracker
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
      - app_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - data:/var/lib/postgresql/data
      - ./init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker_admin -d jobtracker"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
    name: jobtracker-postgres-data
    labels:
      com.jobtracker.purpose: development
secrets:
  admin_password:
    file: ${JOBTRACKER_PG_SECRETS_DIR:?Run scripts/Start-Postgres.ps1}/admin-password
  app_password:
    file: ${JOBTRACKER_PG_SECRETS_DIR:?Run scripts/Start-Postgres.ps1}/app-password
